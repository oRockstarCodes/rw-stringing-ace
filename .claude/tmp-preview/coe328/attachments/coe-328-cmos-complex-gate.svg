<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" font-family="DM Sans, system-ui, sans-serif" font-size="13">
  <g fill="none" stroke="#8a8a93" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- VDD rail -->
    <line x1="110" y1="20" x2="210" y2="20"/>
    <!-- PUN: PMOS A || PMOS B, then PMOS C in series -->
    <polyline points="120,20 120,45"/><line x1="120" y1="45" x2="120" y2="85"/><polyline points="120,85 120,110"/>
    <line x1="112" y1="49" x2="112" y2="81"/><line x1="82" y1="65" x2="102" y2="65"/><circle cx="107" cy="65" r="4"/>
    <polyline points="200,20 200,45"/><line x1="200" y1="45" x2="200" y2="85"/><polyline points="200,85 200,110"/>
    <line x1="192" y1="49" x2="192" y2="81"/><line x1="162" y1="65" x2="182" y2="65"/><circle cx="187" cy="65" r="4"/>
    <line x1="120" y1="110" x2="200" y2="110"/>
    <polyline points="160,110 160,130"/><line x1="160" y1="130" x2="160" y2="170"/><polyline points="160,170 160,190"/>
    <line x1="152" y1="134" x2="152" y2="166"/><line x1="122" y1="150" x2="142" y2="150"/><circle cx="147" cy="150" r="4"/>
    <!-- Output node -->
    <line x1="160" y1="190" x2="290" y2="190"/>
    <polyline points="120,205 120,190 200,190 200,205"/>
    <!-- PDN: (NMOS A series NMOS B) || NMOS C -->
    <polyline points="120,205 120,220"/><line x1="120" y1="220" x2="120" y2="255"/><polyline points="120,255 120,270"/>
    <line x1="112" y1="224" x2="112" y2="251"/><line x1="82" y1="237" x2="112" y2="237"/>
    <line x1="120" y1="270" x2="120" y2="305"/><polyline points="120,305 120,325"/>
    <line x1="112" y1="274" x2="112" y2="301"/><line x1="82" y1="287" x2="112" y2="287"/>
    <polyline points="200,205 200,245"/><line x1="200" y1="245" x2="200" y2="285"/><polyline points="200,285 200,325"/>
    <line x1="192" y1="249" x2="192" y2="281"/><line x1="162" y1="265" x2="192" y2="265"/>
    <!-- GND rail and symbol -->
    <line x1="120" y1="325" x2="200" y2="325"/>
    <line x1="160" y1="325" x2="160" y2="335"/>
    <line x1="146" y1="335" x2="174" y2="335"/><line x1="151" y1="341" x2="169" y2="341"/><line x1="157" y1="347" x2="163" y2="347"/>
  </g>
  <circle cx="160" cy="190" r="3.5" fill="#8a8a93"/>
  <circle cx="290" cy="190" r="4" fill="#8a8a93"/>
  <g fill="#c99a12" font-weight="600">
    <text x="76" y="70" text-anchor="end">A</text>
    <text x="156" y="70" text-anchor="end">B</text>
    <text x="116" y="155" text-anchor="end">C</text>
    <text x="76" y="242" text-anchor="end">A</text>
    <text x="76" y="292" text-anchor="end">B</text>
    <text x="156" y="270" text-anchor="end">C</text>
    <text x="298" y="195">f</text>
  </g>
  <g fill="#8a8a93">
    <text x="218" y="24">V<tspan font-size="10" dy="3">DD</tspan></text>
    <text x="232" y="90" font-size="12">PUN (PMOS)</text>
    <text x="232" y="106" font-size="11">(A ∥ B) in series with C</text>
    <text x="232" y="262" font-size="12">PDN (NMOS)</text>
    <text x="232" y="278" font-size="11">(A in series with B) ∥ C</text>
  </g>
</svg>
