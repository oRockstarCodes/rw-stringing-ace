<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 255" width="410" height="255" font-family="DM Sans, system-ui, sans-serif" font-size="13">
  <!-- Half-adder outlines -->
  <g fill="none" stroke="#8a8a93" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.7">
    <rect x="30" y="20" width="112" height="142" rx="8"/>
    <rect x="190" y="42" width="72" height="170" rx="8"/>
  </g>
  <g fill="#8a8a93" font-size="10" text-anchor="middle" letter-spacing="0.04em">
    <text x="86" y="176">HALF ADDER 1</text>
    <text x="226" y="226">HALF ADDER 2</text>
  </g>
  <g fill="none" stroke="#8a8a93" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- XOR1 -->
    <path d="M80,30 q35,0 55,25 q-20,25 -55,25 q12,-25 0,-50 z"/>
    <path d="M70,30 q12,25 0,50"/>
    <line x1="20" y1="42" x2="74" y2="42"/>
    <line x1="20" y1="68" x2="74" y2="68"/>
    <!-- AND1 -->
    <polyline points="40,42 40,112 80,112"/>
    <polyline points="52,68 52,138 80,138"/>
    <path d="M80,100 h25 a25,25 0 0 1 0,50 h-25 z"/>
    <!-- p = x XOR y -->
    <polyline points="135,55 170,55 170,62 194,62"/>
    <polyline points="170,62 170,162 200,162"/>
    <!-- XOR2 -->
    <path d="M200,50 q35,0 55,25 q-20,25 -55,25 q12,-25 0,-50 z"/>
    <path d="M190,50 q12,25 0,50"/>
    <!-- carry in -->
    <polyline points="20,240 184,240 184,188 200,188"/>
    <polyline points="184,188 184,88 194,88"/>
    <!-- AND2 -->
    <path d="M200,150 h25 a25,25 0 0 1 0,50 h-25 z"/>
    <!-- sum out -->
    <line x1="255" y1="75" x2="360" y2="75"/>
    <!-- g and t into OR -->
    <polyline points="130,125 275,125 275,142 289,142"/>
    <polyline points="250,175 275,175 275,168 289,168"/>
    <!-- OR -->
    <path d="M285,130 q35,0 55,25 q-20,25 -55,25 q12,-25 0,-50 z"/>
    <line x1="340" y1="155" x2="360" y2="155"/>
  </g>
  <g fill="#8a8a93">
    <circle cx="40" cy="42" r="3"/>
    <circle cx="52" cy="68" r="3"/>
    <circle cx="170" cy="62" r="3"/>
    <circle cx="184" cy="188" r="3"/>
  </g>
  <g fill="#8a8a93" font-size="12">
    <text x="148" y="49">x ⊕ y</text>
    <text x="148" y="119">xy</text>
  </g>
  <g fill="#c99a12" font-weight="600">
    <text x="14" y="46" text-anchor="end">x</text>
    <text x="14" y="72" text-anchor="end">y</text>
    <text x="14" y="244" text-anchor="end">c<tspan font-size="10" dy="3">in</tspan></text>
    <text x="366" y="79">s</text>
    <text x="366" y="159">c<tspan font-size="10" dy="3">out</tspan></text>
  </g>
</svg>
