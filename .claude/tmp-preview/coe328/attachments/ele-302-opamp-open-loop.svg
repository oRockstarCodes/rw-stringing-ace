<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 205" width="620" height="205" font-family="DM Sans, system-ui, sans-serif" font-size="13">
  <!-- left: open-loop circuit -->
  <g fill="none" stroke="#8a8a93" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="90,40 90,140 180,90"/>
    <line x1="40" y1="65" x2="90" y2="65"/>
    <line x1="40" y1="115" x2="90" y2="115"/>
    <line x1="180" y1="90" x2="240" y2="90"/>
  </g>
  <g fill="#8a8a93">
    <text x="96" y="70" font-size="16">−</text>
    <text x="96" y="120" font-size="16">+</text>
    <circle cx="40" cy="65" r="4"/>
    <circle cx="40" cy="115" r="4"/>
    <circle cx="240" cy="90" r="4"/>
    <text x="135" y="178" text-anchor="middle" font-style="italic">no path from output back to an input</text>
  </g>
  <g fill="#c99a12" font-weight="600">
    <text x="30" y="70" text-anchor="end">v₋</text>
    <text x="30" y="120" text-anchor="end">v₊</text>
    <text x="250" y="95">vₒ</text>
  </g>

  <!-- right: transfer curve -->
  <g fill="none" stroke="#8a8a93" stroke-width="1.5" stroke-linecap="round">
    <line x1="320" y1="95" x2="605" y2="95"/>
    <line x1="460" y1="22" x2="460" y2="170"/>
  </g>
  <polyline points="325,155 455,155 465,35 600,35" fill="none" stroke="#c99a12" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#8a8a93" font-size="12">
    <text x="452" y="39" text-anchor="end">+15 V</text>
    <text x="468" y="159">−15 V</text>
    <text x="474" y="66">linear only for</text>
    <text x="474" y="82">|v<tspan font-size="9" dy="3">d</tspan><tspan dy="-3">| &lt; 0.15 mV</tspan></text>
    <text x="460" y="196" text-anchor="middle">(A = 10⁵, ±15 V supplies)</text>
  </g>
  <g fill="#c99a12" font-weight="600">
    <text x="466" y="16">vₒ</text>
    <text x="605" y="113" text-anchor="end">v<tspan font-size="10" dy="4">d</tspan><tspan dy="-4"> = v₊ − v₋</tspan></text>
  </g>
</svg>
