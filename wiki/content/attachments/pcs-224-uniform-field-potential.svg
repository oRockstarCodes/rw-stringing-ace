<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" width="520" height="230" font-family="DM Sans, system-ui, sans-serif" font-size="13">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
<rect x="90" y="30" width="10" height="140" fill="#c99a12" opacity=".5" stroke="#8a8a93"/><rect x="330" y="30" width="10" height="140" fill="#2a9d8f" opacity=".5" stroke="#8a8a93"/>
<text x="95" y="24" text-anchor="middle" fill="#c99a12" font-weight="600">+</text><text x="335" y="24" text-anchor="middle" fill="#2a9d8f" font-weight="600">−</text>
<g stroke="#8a8a93" stroke-width="1.5" fill="none">
<line x1="105" y1="70" x2="325" y2="70" marker-end="url(#ah)"/><line x1="105" y1="105" x2="325" y2="105" marker-end="url(#ah)"/><line x1="105" y1="140" x2="325" y2="140" marker-end="url(#ah)"/></g>
<text x="215" y="58" text-anchor="middle" fill="#8a8a93">E (from + to −)</text>
<line x1="90" y1="190" x2="340" y2="190" stroke="#8a8a93" stroke-width="1"/>
<text x="95" y="208" text-anchor="middle" fill="#8a8a93" font-size="12">V = V₀</text><text x="335" y="208" text-anchor="middle" fill="#8a8a93" font-size="12">V = 0</text>
<text x="215" y="208" text-anchor="middle" fill="#8a8a93" font-size="12">V falls along E</text>
<text x="360" y="110" fill="#8a8a93" font-size="12">ΔV = −E·Δx</text>
</svg>
