<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" font-family="DM Sans, system-ui, sans-serif" font-size="12">
  <!-- axes -->
  <g fill="none" stroke="#8a8a93" stroke-width="1.5" stroke-linecap="round">
    <line x1="20" y1="120" x2="335" y2="120"/>
    <line x1="180" y1="25" x2="180" y2="220"/>
  </g>
  <!-- guides -->
  <g fill="none" stroke="#8a8a93" stroke-width="1" stroke-dasharray="4 4">
    <line x1="120" y1="40" x2="120" y2="120"/>
    <line x1="240" y1="120" x2="240" y2="200"/>
  </g>
  <!-- transfer curve -->
  <polyline points="30,40 120,40 240,200 330,200" fill="none" stroke="#c99a12" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="280" cy="200" r="4.5" fill="#c99a12"/>
  <g fill="#8a8a93">
    <text x="188" y="44">+12 V</text>
    <text x="172" y="204" text-anchor="end">−12 V</text>
    <text x="120" y="136" text-anchor="middle">−1.2 V</text>
    <text x="240" y="112" text-anchor="middle">1.2 V</text>
  </g>
  <g fill="#c99a12" font-weight="600" font-size="13">
    <text x="340" y="124">vᵢ</text>
    <text x="186" y="20">vₒ</text>
    <text x="248" y="166">slope −10</text>
    <text x="270" y="228" text-anchor="middle">vᵢ = 2 V → vₒ = −12 V</text>
  </g>
</svg>
