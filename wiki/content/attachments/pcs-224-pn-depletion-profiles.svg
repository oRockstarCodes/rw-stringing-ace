<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="DM Sans, system-ui, sans-serif" font-size="13">
<text x="30" y="24" fill="#8a8a93" font-weight="600">Charge density ρ(x)</text>
<text x="30" y="204" fill="#8a8a93" font-weight="600">Electric field E(x)</text>
<text x="30" y="344" fill="#8a8a93" font-weight="600">Potential φ(x)</text>

<rect x="220" y="80" width="120" height="60" fill="#e76f51" fill-opacity="0.35" stroke="#e76f51" stroke-width="1.5"/>
<rect x="340" y="50" width="240" height="30" fill="#2a9d8f" fill-opacity="0.35" stroke="#2a9d8f" stroke-width="1.5"/>
<line x1="100" y1="80" x2="700" y2="80" stroke="#8a8a93" stroke-width="1.5"/>
<text x="280" y="115" text-anchor="middle" fill="#e76f51" font-weight="600">−eN_a</text>
<text x="460" y="70" text-anchor="middle" fill="#2a9d8f" font-weight="600">+eN_d</text>
<text x="150" y="60" text-anchor="middle" fill="#8a8a93" font-size="12">p (neutral)</text>
<text x="640" y="60" text-anchor="middle" fill="#8a8a93" font-size="12">n (neutral)</text>
<text x="690" y="100" text-anchor="end" fill="#8a8a93" font-size="12">equal areas: N_a x_p = N_d x_n</text>

<line x1="100" y1="230" x2="700" y2="230" stroke="#8a8a93" stroke-width="1.5"/>
<path d="M220 230 L340 292 L580 230 Z" fill="#8a8a93" fill-opacity="0.2" stroke="#8a8a93" stroke-width="2"/>
<text x="348" y="308" fill="#8a8a93" font-size="12">−E_max = −eN_d x_n / ε_s</text>
<text x="450" y="250" fill="#8a8a93" font-size="12">Vtotal = area of the triangle = ½ w E_max</text>
<text x="690" y="224" text-anchor="end" fill="#8a8a93" font-size="12">E points n → p</text>

<line x1="100" y1="390" x2="700" y2="390" stroke="#8a8a93" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="100" y1="290" x2="700" y2="290" stroke="#8a8a93" stroke-width="1" stroke-dasharray="3 4"/>
<path d="M100 390 H220 Q280 390 340 340 Q400 290 580 290 H700" fill="none" stroke="#2a9d8f" stroke-width="2.5"/>
<line x1="672" y1="388" x2="672" y2="292" stroke="#8a8a93" stroke-width="1.5"/>
<path d="M672 292 l-4 8 h8 z" fill="#8a8a93"/><path d="M672 388 l-4 -8 h8 z" fill="#8a8a93"/>
<text x="664" y="344" text-anchor="end" fill="#8a8a93" font-size="12">V_total = V_bi − V_D</text>

<line x1="220" y1="40" x2="220" y2="410" stroke="#8a8a93" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="340" y1="40" x2="340" y2="410" stroke="#8a8a93" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="580" y1="40" x2="580" y2="410" stroke="#8a8a93" stroke-width="1" stroke-dasharray="3 4"/>
<text x="220" y="430" text-anchor="middle" fill="#8a8a93">−x_p</text>
<text x="340" y="430" text-anchor="middle" fill="#8a8a93">0 (junction)</text>
<text x="580" y="430" text-anchor="middle" fill="#8a8a93">x_n</text>
<line x1="220" y1="448" x2="580" y2="448" stroke="#8a8a93" stroke-width="1.5"/>
<path d="M220 448 l8 -4 v8 z M580 448 l-8 -4 v8 z" fill="#8a8a93"/>
<text x="400" y="464" text-anchor="middle" fill="#8a8a93">depletion region, width w = x_n + x_p</text>
</svg>
