<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 320" width="470" height="320" font-family="DM Sans, system-ui, sans-serif" font-size="13">
  <g fill="none" stroke="#8a8a93" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- op amp (+ on top here) -->
    <polygon points="240,100 240,200 330,150"/>
    <!-- source through 4k to v+ -->
    <line x1="30" y1="125" x2="70" y2="125"/>
    <polyline points="70,125 75,117 85,133 95,117 105,133 115,117 125,133 130,125"/>
    <line x1="130" y1="125" x2="240" y2="125"/>
    <!-- 8k to ground -->
    <line x1="150" y1="125" x2="150" y2="140"/>
    <polyline points="150,140 158,145 142,155 158,165 142,175 158,185 142,195 150,200"/>
    <line x1="150" y1="200" x2="150" y2="210"/>
    <line x1="138" y1="210" x2="162" y2="210"/>
    <line x1="143" y1="216" x2="157" y2="216"/>
    <line x1="148" y1="222" x2="152" y2="222"/>
    <!-- v- wire -->
    <line x1="240" y1="175" x2="195" y2="175"/>
    <!-- R1 to ground -->
    <line x1="195" y1="175" x2="195" y2="190"/>
    <polyline points="195,190 203,195 187,205 203,215 187,225 203,235 187,245 195,250"/>
    <line x1="195" y1="250" x2="195" y2="260"/>
    <line x1="183" y1="260" x2="207" y2="260"/>
    <line x1="188" y1="266" x2="202" y2="266"/>
    <line x1="193" y1="272" x2="197" y2="272"/>
    <!-- feedback through Rf -->
    <line x1="225" y1="175" x2="225" y2="285"/>
    <line x1="225" y1="285" x2="270" y2="285"/>
    <polyline points="270,285 275,277 285,293 295,277 305,293 315,277 325,293 330,285"/>
    <line x1="330" y1="285" x2="380" y2="285"/>
    <line x1="380" y1="285" x2="380" y2="150"/>
    <!-- output -->
    <line x1="330" y1="150" x2="430" y2="150"/>
  </g>
  <g fill="#8a8a93">
    <text x="247" y="131" font-size="16">+</text>
    <text x="247" y="181" font-size="16">−</text>
    <circle cx="150" cy="125" r="4"/>
    <circle cx="225" cy="175" r="4"/>
    <circle cx="380" cy="150" r="4"/>
    <circle cx="30" cy="125" r="4"/>
    <circle cx="430" cy="150" r="4"/>
  </g>
  <g fill="#c99a12" font-weight="600">
    <text x="10" y="110">vₛ = 6 V</text>
    <text x="100" y="108" text-anchor="middle">4 kΩ</text>
    <text x="136" y="175" text-anchor="end">8 kΩ</text>
    <text x="181" y="248" text-anchor="end">R₁ = 5 kΩ</text>
    <text x="300" y="312" text-anchor="middle">R<tspan font-size="10" dy="4">f</tspan><tspan dy="-4"> = 10 kΩ</tspan></text>
    <text x="440" y="155">vₒ</text>
  </g>
</svg>
