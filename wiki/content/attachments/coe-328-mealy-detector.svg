<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="460" height="200" font-family="DM Sans, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a93"/>
    </marker>
  </defs>
  <g fill="none" stroke="#8a8a93" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="110" cy="90" r="30"/>
    <circle cx="350" cy="90" r="30"/>
    <!-- A -> B -->
    <path d="M138,76 C190,50 270,50 322,76" marker-end="url(#ah)"/>
    <!-- B -> A -->
    <path d="M322,104 C270,130 190,130 138,104" marker-end="url(#ah)"/>
    <!-- Self loops -->
    <path d="M96,62 C80,20 140,20 124,62" marker-end="url(#ah)"/>
    <path d="M336,62 C320,20 380,20 364,62" marker-end="url(#ah)"/>
    <!-- Reset -->
    <line x1="20" y1="90" x2="78" y2="90" marker-end="url(#ah)"/>
  </g>
  <g fill="#c99a12" font-weight="600" text-anchor="middle">
    <text x="110" y="95">A</text>
    <text x="350" y="95">B</text>
  </g>
  <g fill="#8a8a93" text-anchor="middle" font-size="12">
    <text x="230" y="44">w=1 / z=0</text>
    <text x="230" y="150">w=0 / z=0</text>
    <text x="110" y="14">w=0 / z=0</text>
    <text x="350" y="14">w=1 / z=1</text>
    <text x="48" y="82">Reset</text>
  </g>
</svg>
