<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 0 610 170" width="610" height="170" font-family="DM Sans, system-ui, sans-serif" font-size="13">
  <g fill="none" stroke="#8a8a93" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Four D flip-flops -->
    <rect x="70" y="30" width="70" height="80" rx="3"/>
    <rect x="190" y="30" width="70" height="80" rx="3"/>
    <rect x="310" y="30" width="70" height="80" rx="3"/>
    <rect x="430" y="30" width="70" height="80" rx="3"/>
    <!-- Clock triangles -->
    <polyline points="70,84 80,90 70,96"/>
    <polyline points="190,84 200,90 190,96"/>
    <polyline points="310,84 320,90 310,96"/>
    <polyline points="430,84 440,90 430,96"/>
    <!-- Data chain: In -> D1, Q1 -> D2, Q2 -> D3, Q3 -> D4, Q4 -> Out -->
    <line x1="30" y1="50" x2="70" y2="50"/>
    <line x1="140" y1="50" x2="190" y2="50"/>
    <line x1="260" y1="50" x2="310" y2="50"/>
    <line x1="380" y1="50" x2="430" y2="50"/>
    <line x1="500" y1="50" x2="535" y2="50"/>
    <!-- Shared clock -->
    <polyline points="30,140 410,140 410,90 430,90"/>
    <polyline points="50,140 50,90 70,90"/>
    <polyline points="170,140 170,90 190,90"/>
    <polyline points="290,140 290,90 310,90"/>
  </g>
  <g fill="#8a8a93">
    <circle cx="50" cy="140" r="3"/>
    <circle cx="170" cy="140" r="3"/>
    <circle cx="290" cy="140" r="3"/>
  </g>
  <g fill="#8a8a93" font-size="12">
    <text x="78" y="54">D</text>
    <text x="198" y="54">D</text>
    <text x="318" y="54">D</text>
    <text x="438" y="54">D</text>
    <text x="132" y="54" text-anchor="end">Q</text>
    <text x="252" y="54" text-anchor="end">Q</text>
    <text x="372" y="54" text-anchor="end">Q</text>
    <text x="492" y="54" text-anchor="end">Q</text>
  </g>
  <g fill="#c99a12" font-weight="600">
    <text x="24" y="54" text-anchor="end">In</text>
    <text x="24" y="144" text-anchor="end">Clock</text>
    <text x="165" y="40" text-anchor="middle">Q<tspan font-size="10" dy="3">1</tspan></text>
    <text x="285" y="40" text-anchor="middle">Q<tspan font-size="10" dy="3">2</tspan></text>
    <text x="405" y="40" text-anchor="middle">Q<tspan font-size="10" dy="3">3</tspan></text>
    <text x="518" y="40" text-anchor="middle">Q<tspan font-size="10" dy="3">4</tspan></text>
    <text x="540" y="54">Out</text>
  </g>
</svg>
