<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 290" width="460" height="290" font-family="DM Sans, system-ui, sans-serif" font-size="13">
  <g fill="none" stroke="#8a8a93" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- op amp -->
    <polygon points="200,100 200,200 290,150"/>
    <!-- input through R1 -->
    <line x1="40" y1="125" x2="80" y2="125"/>
    <polyline points="80,125 85,117 95,133 105,117 115,133 125,117 135,133 140,125"/>
    <line x1="140" y1="125" x2="200" y2="125"/>
    <!-- feedback through Rf -->
    <line x1="165" y1="125" x2="165" y2="55"/>
    <line x1="165" y1="55" x2="215" y2="55"/>
    <polyline points="215,55 220,47 230,63 240,47 250,63 260,47 270,63 275,55"/>
    <line x1="275" y1="55" x2="330" y2="55"/>
    <line x1="330" y1="55" x2="330" y2="150"/>
    <!-- output -->
    <line x1="290" y1="150" x2="420" y2="150"/>
    <!-- load RL to ground -->
    <line x1="370" y1="150" x2="370" y2="175"/>
    <polyline points="370,175 378,180 362,190 378,200 362,210 378,220 362,230 370,235"/>
    <line x1="370" y1="235" x2="370" y2="250"/>
    <line x1="358" y1="250" x2="382" y2="250"/>
    <line x1="363" y1="256" x2="377" y2="256"/>
    <line x1="368" y1="262" x2="372" y2="262"/>
    <!-- v+ to ground -->
    <line x1="200" y1="175" x2="175" y2="175"/>
    <line x1="175" y1="175" x2="175" y2="200"/>
    <line x1="163" y1="200" x2="187" y2="200"/>
    <line x1="168" y1="206" x2="182" y2="206"/>
    <line x1="173" y1="212" x2="177" y2="212"/>
  </g>
  <g fill="#8a8a93">
    <text x="206" y="130" font-size="16">−</text>
    <text x="206" y="180" font-size="16">+</text>
    <circle cx="165" cy="125" r="4"/>
    <circle cx="330" cy="150" r="4"/>
    <circle cx="370" cy="150" r="4"/>
    <circle cx="40" cy="125" r="4"/>
    <circle cx="420" cy="150" r="4"/>
  </g>
  <!-- current arrows -->
  <g fill="#c99a12">
    <polygon points="304,144 314,150 304,156"/>
    <polygon points="308,49 298,55 308,61"/>
    <polygon points="364,158 370,168 376,158"/>
  </g>
  <g fill="#c99a12" font-weight="600">
    <text x="10" y="110">vᵢ = −0.5 V</text>
    <text x="110" y="155" text-anchor="middle">R₁ = 10 kΩ</text>
    <text x="245" y="35" text-anchor="middle">R<tspan font-size="10" dy="4">f</tspan><tspan dy="-4"> = 40 kΩ</tspan></text>
    <text x="300" y="44">i<tspan font-size="10" dy="4">f</tspan></text>
    <text x="300" y="139">iₒ</text>
    <text x="382" y="168">i<tspan font-size="10" dy="4">L</tspan></text>
    <text x="384" y="210">R<tspan font-size="10" dy="4">L</tspan><tspan dy="-4"> = 8 kΩ</tspan></text>
    <text x="430" y="155">vₒ</text>
  </g>
</svg>
