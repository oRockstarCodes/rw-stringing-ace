<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" width="780" height="290" font-family="DM Sans, system-ui, sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8a93"/></marker></defs>
<text x="195" y="22" text-anchor="middle" fill="#8a8a93" font-weight="600">p-type: holes carry the current</text>
<rect x="40" y="70" width="310" height="110" fill="#8a8a93" fill-opacity="0.08" stroke="#8a8a93" stroke-width="1.5"/>
<rect x="40" y="70" width="310" height="14" fill="#2a9d8f" fill-opacity="0.45"/><text x="195" y="81" text-anchor="middle" fill="#8a8a93" font-weight="700" font-size="12">+ + + + + + + + +</text>
<rect x="40" y="166" width="310" height="14" fill="#e76f51" fill-opacity="0.45"/><text x="195" y="177" text-anchor="middle" fill="#8a8a93" font-weight="700" font-size="12">− − − − − − − − −</text>
<line x1="70" y1="125" x2="160" y2="125" stroke="#8a8a93" stroke-width="2.5" marker-end="url(#a)"/><text x="115" y="118" text-anchor="middle" fill="#8a8a93" font-size="12">I and hole motion</text>
<line x1="230" y1="135" x2="230" y2="98" stroke="#2a9d8f" stroke-width="2.5" marker-end="url(#a)"/><text x="262" y="118" fill="#2a9d8f" font-size="12" font-weight="600">F_m (up)</text>
<circle cx="310" cy="135" r="9" fill="none" stroke="#8a8a93" stroke-width="1.5"/><path d="M304 129 L316 141 M316 129 L304 141" stroke="#8a8a93" stroke-width="1.5"/><text x="310" y="160" text-anchor="middle" fill="#8a8a93" font-size="12">B in</text>
<text x="195" y="215" text-anchor="middle" fill="#8a8a93" font-size="12">top edge collects + charge, so it is at higher potential</text>
<text x="195" y="233" text-anchor="middle" fill="#8a8a93" font-weight="600">V_H &gt; 0</text>

<text x="585" y="22" text-anchor="middle" fill="#8a8a93" font-weight="600">n-type: electrons carry the current</text>
<rect x="430" y="70" width="310" height="110" fill="#8a8a93" fill-opacity="0.08" stroke="#8a8a93" stroke-width="1.5"/>
<rect x="430" y="70" width="310" height="14" fill="#e76f51" fill-opacity="0.45"/><text x="585" y="81" text-anchor="middle" fill="#8a8a93" font-weight="700" font-size="12">− − − − − − − − −</text>
<rect x="430" y="166" width="310" height="14" fill="#2a9d8f" fill-opacity="0.45"/><text x="585" y="177" text-anchor="middle" fill="#8a8a93" font-weight="700" font-size="12">+ + + + + + + + +</text>
<line x1="460" y1="125" x2="550" y2="125" stroke="#8a8a93" stroke-width="2.5" marker-end="url(#a)"/><text x="505" y="118" text-anchor="middle" fill="#8a8a93" font-size="12">I (conventional)</text>
<line x1="660" y1="125" x2="570" y2="125" stroke="#e76f51" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="640" y="150" text-anchor="middle" fill="#e76f51" font-size="12">electrons move left</text>
<line x1="620" y1="105" x2="620" y2="98" stroke="#2a9d8f" stroke-width="2.5" marker-end="url(#a)"/><text x="672" y="102" fill="#2a9d8f" font-size="12" font-weight="600">F_m (up)</text>
<circle cx="700" cy="135" r="9" fill="none" stroke="#8a8a93" stroke-width="1.5"/><path d="M694 129 L706 141 M706 129 L694 141" stroke="#8a8a93" stroke-width="1.5"/><text x="700" y="160" text-anchor="middle" fill="#8a8a93" font-size="12">B in</text>
<text x="585" y="215" text-anchor="middle" fill="#8a8a93" font-size="12">top edge collects − charge, so it is at lower potential</text>
<text x="585" y="233" text-anchor="middle" fill="#8a8a93" font-weight="600">V_H &lt; 0</text>

<text x="390" y="272" text-anchor="middle" fill="#8a8a93" font-size="12">F_m points along I × B for both signs, so both kinds of carrier pile up on the same edge. Only the sign of that charge differs.</text>
</svg>
