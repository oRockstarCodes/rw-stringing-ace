<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="460" height="280" font-family="DM Sans, system-ui, sans-serif" font-size="13">
  <g fill="none" stroke="#8a8a93" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- op amp -->
    <polygon points="240,100 240,200 330,150"/>
    <!-- v1 through R1 -->
    <line x1="70" y1="125" x2="100" y2="125"/>
    <polyline points="100,125 105,117 115,133 125,117 135,133 145,117 155,133 160,125"/>
    <line x1="160" y1="125" x2="240" y2="125"/>
    <!-- feedback through R2 -->
    <line x1="200" y1="125" x2="200" y2="55"/>
    <line x1="200" y1="55" x2="250" y2="55"/>
    <polyline points="250,55 255,47 265,63 275,47 285,63 295,47 305,63 310,55"/>
    <line x1="310" y1="55" x2="370" y2="55"/>
    <line x1="370" y1="55" x2="370" y2="150"/>
    <!-- v2 through R3 -->
    <line x1="70" y1="175" x2="100" y2="175"/>
    <polyline points="100,175 105,167 115,183 125,167 135,183 145,167 155,183 160,175"/>
    <line x1="160" y1="175" x2="240" y2="175"/>
    <!-- R4 to ground -->
    <line x1="200" y1="175" x2="200" y2="190"/>
    <polyline points="200,190 208,195 192,205 208,215 192,225 208,235 192,245 200,250"/>
    <line x1="200" y1="250" x2="200" y2="258"/>
    <line x1="188" y1="258" x2="212" y2="258"/>
    <line x1="193" y1="264" x2="207" y2="264"/>
    <line x1="198" y1="270" x2="202" y2="270"/>
    <!-- output -->
    <line x1="330" y1="150" x2="420" y2="150"/>
  </g>
  <g fill="#8a8a93">
    <text x="246" y="130" font-size="16">−</text>
    <text x="246" y="180" font-size="16">+</text>
    <circle cx="200" cy="125" r="4"/>
    <circle cx="200" cy="175" r="4"/>
    <circle cx="370" cy="150" r="4"/>
    <circle cx="70" cy="125" r="4"/>
    <circle cx="70" cy="175" r="4"/>
    <circle cx="420" cy="150" r="4"/>
  </g>
  <g fill="#c99a12" font-weight="600">
    <text x="62" y="130" text-anchor="end">v₁ = 2 V</text>
    <text x="62" y="180" text-anchor="end">v₂ = 3 V</text>
    <text x="130" y="108" text-anchor="middle">R₁ = 10 kΩ</text>
    <text x="130" y="202" text-anchor="middle">R₃ = 10 kΩ</text>
    <text x="280" y="35" text-anchor="middle">R₂ = 50 kΩ</text>
    <text x="216" y="225">R₄ = 50 kΩ</text>
    <text x="430" y="155">vₒ</text>
  </g>
</svg>
