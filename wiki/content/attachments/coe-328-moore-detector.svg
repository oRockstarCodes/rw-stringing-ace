<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" font-family="DM Sans, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a93"/>
    </marker>
  </defs>
  <g fill="none" stroke="#8a8a93" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- States -->
    <circle cx="100" cy="90" r="30"/>
    <circle cx="280" cy="90" r="30"/>
    <circle cx="460" cy="90" r="30"/>
    <!-- Forward arcs -->
    <line x1="130" y1="90" x2="248" y2="90" marker-end="url(#ah)"/>
    <line x1="310" y1="90" x2="428" y2="90" marker-end="url(#ah)"/>
    <!-- Self loops -->
    <path d="M86,62 C70,20 130,20 114,62" marker-end="url(#ah)"/>
    <path d="M446,62 C430,20 490,20 474,62" marker-end="url(#ah)"/>
    <!-- Return arcs to A -->
    <path d="M270,119 C250,170 150,170 112,118" marker-end="url(#ah)"/>
    <path d="M450,119 C430,215 130,215 94,118" marker-end="url(#ah)"/>
    <!-- Reset -->
    <line x1="20" y1="90" x2="68" y2="90" marker-end="url(#ah)"/>
  </g>
  <g fill="#c99a12" font-weight="600" text-anchor="middle">
    <text x="100" y="88">A</text><text x="100" y="103" font-size="11">z=0</text>
    <text x="280" y="88">B</text><text x="280" y="103" font-size="11">z=0</text>
    <text x="460" y="88">C</text><text x="460" y="103" font-size="11">z=1</text>
  </g>
  <g fill="#8a8a93" text-anchor="middle" font-size="12">
    <text x="190" y="82">w = 1</text>
    <text x="370" y="82">w = 1</text>
    <text x="100" y="20">w = 0</text>
    <text x="460" y="20">w = 1</text>
    <text x="195" y="160">w = 0</text>
    <text x="290" y="205">w = 0</text>
    <text x="44" y="82">Reset</text>
  </g>
</svg>
