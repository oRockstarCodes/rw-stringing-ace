<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" width="780" height="290" font-family="DM Sans, system-ui, sans-serif" font-size="13">
<g stroke="#8a8a93" stroke-width="3">
<line x1="70" y1="70" x2="130" y2="70"/><line x1="70" y1="200" x2="130" y2="200"/>
<line x1="250" y1="64" x2="310" y2="64"/><line x1="250" y1="78" x2="310" y2="78"/><line x1="250" y1="194" x2="310" y2="194"/><line x1="250" y1="208" x2="310" y2="208"/>
<line x1="430" y1="54" x2="490" y2="54"/><line x1="430" y1="64" x2="490" y2="64"/><line x1="430" y1="74" x2="490" y2="74"/><line x1="430" y1="84" x2="490" y2="84"/>
<line x1="430" y1="184" x2="490" y2="184"/><line x1="430" y1="194" x2="490" y2="194"/><line x1="430" y1="204" x2="490" y2="204"/><line x1="430" y1="214" x2="490" y2="214"/>
</g>
<rect x="610" y="45" width="60" height="50" fill="#2a9d8f" fill-opacity="0.35" stroke="#2a9d8f" stroke-width="2"/>
<rect x="610" y="175" width="60" height="50" fill="#8a8a93" fill-opacity="0.35" stroke="#8a8a93" stroke-width="2"/>
<text x="640" y="25" text-anchor="middle" fill="#2a9d8f" font-size="12" font-weight="600">conduction band</text>
<text x="640" y="245" text-anchor="middle" fill="#8a8a93" font-size="12" font-weight="600">valence band</text>
<text x="640" y="140" text-anchor="middle" fill="#8a8a93" font-size="12">gap E_g</text>
<line x1="700" y1="95" x2="700" y2="175" stroke="#8a8a93" stroke-width="1.5"/>
<path d="M700 95 l-4 8 h8 z M700 175 l-4 -8 h8 z" fill="#8a8a93"/>
<text x="680" y="70" fill="#8a8a93" font-size="12">E_c</text><text x="680" y="205" fill="#8a8a93" font-size="12">E_v</text>
<g text-anchor="middle" fill="#8a8a93" font-weight="600">
<text x="100" y="268">1 atom</text><text x="280" y="268">2 atoms</text><text x="460" y="268">4 atoms</text><text x="640" y="268">~10²² atoms/cm³</text></g>
<text x="100" y="40" text-anchor="middle" fill="#8a8a93" font-size="12">one level</text>
<text x="280" y="40" text-anchor="middle" fill="#8a8a93" font-size="12">each level splits in 2</text>
<text x="460" y="40" text-anchor="middle" fill="#8a8a93" font-size="12">each level splits in 4</text>
<text x="390" y="140" text-anchor="middle" fill="#8a8a93" font-size="12">Pauli exclusion: no two electrons share a state, so the levels spread</text>
</svg>
