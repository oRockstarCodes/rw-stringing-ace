<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 195" width="520" height="195" font-family="DM Sans, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c99a12"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a93"/></marker>
  </defs>
  <text x="10" y="16" font-size="12" text-anchor="start" fill="#8a8a93" font-weight="600">Primitive: the value is copied</text>
  <rect x="70" y="46" width="56" height="26" rx="4" fill="none" stroke="#8a8a93" stroke-width="2"/>
  <text x="62" y="64" font-size="13" text-anchor="end" fill="#8a8a93">d</text>
  <text x="70" y="42" font-size="10" text-anchor="start" fill="#8a8a93">main</text>
  <text x="98" y="64" font-size="13" text-anchor="middle" fill="#8a8a93" font-weight="600">2.0</text>
  <rect x="70" y="106" width="56" height="26" rx="4" fill="none" stroke="#8a8a93" stroke-width="2"/>
  <text x="62" y="124" font-size="13" text-anchor="end" fill="#8a8a93">d</text>
  <text x="70" y="102" font-size="10" text-anchor="start" fill="#8a8a93">changeMe</text>
  <text x="98" y="124" font-size="13" text-anchor="middle" fill="#8a8a93" font-weight="600">345.0</text>
  <text x="10" y="165" font-size="11" text-anchor="start" fill="#8a8a93" font-style="italic">Changing the copy leaves</text>
  <text x="10" y="180" font-size="11" text-anchor="start" fill="#8a8a93" font-style="italic">the caller's d at 2.0</text>
  <line x1="250" y1="8" x2="250" y2="185" stroke="#8a8a93" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="270" y="16" font-size="12" text-anchor="start" fill="#8a8a93" font-weight="600">Reference: the address is copied</text>
  <rect x="325" y="46" width="56" height="26" rx="4" fill="none" stroke="#8a8a93" stroke-width="2"/>
  <text x="317" y="64" font-size="13" text-anchor="end" fill="#8a8a93">miniVan</text>
  <text x="325" y="42" font-size="10" text-anchor="start" fill="#8a8a93">main</text>
  <circle cx="353" cy="59" r="4.5" fill="#c99a12"/>
  <rect x="325" y="106" width="56" height="26" rx="4" fill="none" stroke="#8a8a93" stroke-width="2"/>
  <text x="317" y="124" font-size="13" text-anchor="end" fill="#8a8a93">c</text>
  <text x="325" y="102" font-size="10" text-anchor="start" fill="#8a8a93">changeParameters</text>
  <circle cx="353" cy="119" r="4.5" fill="#c99a12"/>
  <rect x="425" y="70" width="90" height="46" rx="4" fill="none" stroke="#8a8a93" stroke-width="2"/>
  <rect x="425" y="70" width="90" height="24" rx="4" fill="#8a8a93" fill-opacity="0.16" stroke="#8a8a93" stroke-width="0"/>
  <text x="470" y="86.5" font-size="13" text-anchor="middle" fill="#8a8a93" font-weight="600">Car</text>
  <line x1="425" y1="94" x2="515" y2="94" stroke="#8a8a93" stroke-width="1.2"/>
  <text x="435" y="109" font-size="13" text-anchor="start" fill="#8a8a93">speed</text>
  <text x="505" y="109" font-size="13" text-anchor="end" fill="#8a8a93" font-weight="600">30.0</text>
  <path d="M353,59 L425,85" fill="none" stroke="#c99a12" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M353,119 L425,101" fill="none" stroke="#c99a12" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="270" y="165" font-size="11" text-anchor="start" fill="#8a8a93" font-style="italic">Both refer to the same Car, so</text>
  <text x="270" y="180" font-size="11" text-anchor="start" fill="#8a8a93" font-style="italic">c.speed = 30 is seen by main</text>
</svg>
