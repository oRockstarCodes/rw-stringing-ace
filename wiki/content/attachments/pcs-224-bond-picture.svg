<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" width="780" height="290" font-family="DM Sans, system-ui, sans-serif" font-size="13">
<g stroke="#8a8a93" stroke-width="1.5">
<line x1="50" y1="70" x2="170" y2="70"/><line x1="50" y1="130" x2="170" y2="130"/><line x1="50" y1="190" x2="170" y2="190"/>
<line x1="50" y1="70" x2="50" y2="190"/><line x1="110" y1="70" x2="110" y2="190"/><line x1="170" y1="70" x2="170" y2="190"/>
<line x1="310" y1="70" x2="430" y2="70"/><line x1="310" y1="130" x2="430" y2="130"/><line x1="310" y1="190" x2="430" y2="190"/>
<line x1="310" y1="70" x2="310" y2="190"/><line x1="370" y1="70" x2="370" y2="190"/><line x1="430" y1="70" x2="430" y2="190"/>
<line x1="570" y1="70" x2="690" y2="70"/><line x1="570" y1="130" x2="690" y2="130"/><line x1="570" y1="190" x2="690" y2="190"/>
<line x1="570" y1="70" x2="570" y2="190"/><line x1="630" y1="70" x2="630" y2="190"/><line x1="690" y1="70" x2="690" y2="190"/>
</g>
<g fill="#8a8a93" fill-opacity="0.35" stroke="#8a8a93" stroke-width="1.5">
<circle cx="50" cy="70" r="13"/><circle cx="110" cy="70" r="13"/><circle cx="170" cy="70" r="13"/><circle cx="50" cy="130" r="13"/><circle cx="110" cy="130" r="13"/><circle cx="170" cy="130" r="13"/><circle cx="50" cy="190" r="13"/><circle cx="110" cy="190" r="13"/><circle cx="170" cy="190" r="13"/>
<circle cx="310" cy="70" r="13"/><circle cx="370" cy="70" r="13"/><circle cx="430" cy="70" r="13"/><circle cx="310" cy="130" r="13"/><circle cx="430" cy="130" r="13"/><circle cx="310" cy="190" r="13"/><circle cx="370" cy="190" r="13"/><circle cx="430" cy="190" r="13"/>
<circle cx="570" cy="70" r="13"/><circle cx="630" cy="70" r="13"/><circle cx="690" cy="70" r="13"/><circle cx="570" cy="130" r="13"/><circle cx="690" cy="130" r="13"/><circle cx="570" cy="190" r="13"/><circle cx="630" cy="190" r="13"/><circle cx="690" cy="190" r="13"/>
</g>
<circle cx="370" cy="130" r="15" fill="#2a9d8f" fill-opacity="0.55" stroke="#2a9d8f" stroke-width="2"/><text x="370" y="135" text-anchor="middle" fill="#8a8a93" font-weight="700">P⁺</text>
<circle cx="630" cy="130" r="15" fill="#e76f51" fill-opacity="0.55" stroke="#e76f51" stroke-width="2"/><text x="630" y="135" text-anchor="middle" fill="#8a8a93" font-weight="700">B⁻</text>
<text x="110" y="135" text-anchor="middle" fill="#8a8a93" font-size="12">Si</text>

<circle cx="80" cy="130" r="8" fill="none" stroke="#e76f51" stroke-width="2.5"/>
<text x="80" y="152" text-anchor="middle" fill="#e76f51" font-size="12" font-weight="600">hole</text>
<circle cx="150" cy="100" r="6" fill="#2a9d8f"/>
<text x="150" y="88" text-anchor="middle" fill="#2a9d8f" font-size="12" font-weight="600">e⁻ free</text>

<circle cx="395" cy="108" r="6" fill="#2a9d8f"/>
<text x="425" y="106" fill="#2a9d8f" font-size="12" font-weight="600">extra e⁻</text>

<circle cx="600" cy="130" r="8" fill="none" stroke="#e76f51" stroke-width="2.5"/>
<text x="600" y="152" text-anchor="middle" fill="#e76f51" font-size="12" font-weight="600">hole</text>

<text x="110" y="24" text-anchor="middle" fill="#8a8a93" font-weight="600">Intrinsic silicon</text>
<text x="110" y="42" text-anchor="middle" fill="#8a8a93" font-size="12">heat breaks one bond</text>
<text x="370" y="24" text-anchor="middle" fill="#8a8a93" font-weight="600">n-type (donor, Group V)</text>
<text x="370" y="42" text-anchor="middle" fill="#8a8a93" font-size="12">phosphorus has a 5th electron</text>
<text x="630" y="24" text-anchor="middle" fill="#8a8a93" font-weight="600">p-type (acceptor, Group III)</text>
<text x="630" y="42" text-anchor="middle" fill="#8a8a93" font-size="12">boron is one electron short</text>
<text x="110" y="250" text-anchor="middle" fill="#8a8a93" font-size="12">one electron + one hole: n₀ = p₀ = nᵢ</text>
<text x="370" y="250" text-anchor="middle" fill="#8a8a93" font-size="12">many electrons, few holes: n₀ ≈ N_D</text>
<text x="630" y="250" text-anchor="middle" fill="#8a8a93" font-size="12">many holes, few electrons: p₀ ≈ N_A</text>
<text x="390" y="278" text-anchor="middle" fill="#8a8a93" font-size="12">lines are covalent bonds; the P⁺ and B⁻ ions are fixed in the crystal and don't carry current</text>
</svg>
