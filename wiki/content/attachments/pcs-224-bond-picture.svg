<text x="784.0" y="354.0" text-anchor="middle" fill="#e76f51" font-size="13" font-weight="600">hole</text>
<path d="M 752.0 332 C 732.0 354, 686 354, 670 336" fill="none" stroke="#e76f51" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ae76f51)"/>
<text x="160.0" y="26.0" text-anchor="middle" fill="#8a8a93" font-size="16" font-weight="700">Intrinsic silicon</text>
<text x="160.0" y="46.0" text-anchor="middle" fill="#8a8a93" font-size="13" font-weight="400">heat breaks one bond</text>
<text x="160.0" y="418.0" text-anchor="middle" fill="#8a8a93" font-size="13" font-weight="400">a freed electron leaves a hole behind</text>
<text x="160.0" y="438.0" text-anchor="middle" fill="#8a8a93" font-size="13" font-weight="400">n₀ = p₀ = nᵢ</text>
<text x="480.0" y="26.0" text-anchor="middle" fill="#8a8a93" font-size="16" font-weight="700">n-type: donor (Group V)</text>
<text x="480.0" y="46.0" text-anchor="middle" fill="#8a8a93" font-size="13" font-weight="400">phosphorus has a 5th electron</text>
<text x="480.0" y="418.0" text-anchor="middle" fill="#8a8a93" font-size="13" font-weight="400">the 5th electron is not needed for bonding,</text>
<text x="480.0" y="438.0" text-anchor="middle" fill="#8a8a93" font-size="13" font-weight="400">so it breaks free and leaves P⁺ fixed</text>
<text x="480.0" y="458.0" text-anchor="middle" fill="#8a8a93" font-size="13" font-weight="400">n₀ ≈ N_D</text>
<text x="800.0" y="26.0" text-anchor="middle" fill="#8a8a93" font-size="16" font-weight="700">p-type: acceptor (Group III)</text>
<text x="800.0" y="46.0" text-anchor="middle" fill="#8a8a93" font-size="13" font-weight="400">boron is one electron short</text>
<text x="800.0" y="418.0" text-anchor="middle" fill="#8a8a93" font-size="13" font-weight="400">B grabs an electron from a nearby bond</text>
<text x="800.0" y="438.0" text-anchor="middle" fill="#8a8a93" font-size="13" font-weight="400">so B⁻ stays fixed and the hole moves on</text>
<text x="800.0" y="458.0" text-anchor="middle" fill="#8a8a93" font-size="13" font-weight="400">p₀ ≈ N_A</text>
<circle cx="150" cy="500" r="4" fill="#8a8a93"/><text x="160" y="504" fill="#8a8a93" font-size="12">bonded electron</text>
