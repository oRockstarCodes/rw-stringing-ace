<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" font-family="DM Sans, system-ui, sans-serif" font-size="14">
  <g fill="none" stroke="#8a8a93" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- source -->
    <circle cx="60" cy="110" r="22"/>
    <line x1="60" y1="88" x2="60" y2="30"/>
    <line x1="60" y1="132" x2="60" y2="190"/>
    <!-- top wire to R1 -->
    <line x1="60" y1="30" x2="180" y2="30"/>
    <line x1="180" y1="30" x2="180" y2="44"/>
    <!-- R1 zigzag -->
    <polyline points="180,44 168,50 192,58 168,66 192,74 168,82 192,90 180,96"/>
    <!-- middle node -->
    <line x1="180" y1="96" x2="180" y2="114"/>
    <line x1="180" y1="105" x2="280" y2="105"/>
    <!-- R2 zigzag -->
    <polyline points="180,114 168,120 192,128 168,136 192,144 168,152 192,160 180,166"/>
    <line x1="180" y1="166" x2="180" y2="190"/>
    <!-- bottom wire -->
    <line x1="60" y1="190" x2="280" y2="190"/>
  </g>
  <!-- source polarity -->
  <g fill="#8a8a93">
    <text x="55" y="104" font-size="13">+</text>
    <text x="56" y="124" font-size="13">−</text>
    <circle cx="180" cy="105" r="4"/>
    <circle cx="280" cy="105" r="4"/>
    <circle cx="280" cy="190" r="4"/>
  </g>
  <g fill="#c99a12" font-weight="600">
    <text x="18" y="115">Vₛ</text>
    <text x="202" y="76">R₁</text>
    <text x="202" y="146">R₂</text>
    <text x="292" y="110">+</text>
    <text x="292" y="152">Vₒᵤₜ</text>
    <text x="292" y="195">−</text>
  </g>
</svg>
