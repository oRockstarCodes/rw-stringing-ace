<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" width="540" height="200" font-family="DM Sans, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c99a12"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a93"/></marker>
  </defs>
  <rect x="100" y="22" width="56" height="26" rx="4" fill="none" stroke="#8a8a93" stroke-width="2"/>
  <text x="92" y="40" font-size="13" text-anchor="end" fill="#8a8a93">d : Dog</text>
  <circle cx="128" cy="35" r="4.5" fill="#c99a12"/>
  <rect x="100" y="84" width="56" height="26" rx="4" fill="none" stroke="#8a8a93" stroke-width="2"/>
  <text x="92" y="102" font-size="13" text-anchor="end" fill="#8a8a93">a : Animal</text>
  <circle cx="128" cy="97" r="4.5" fill="#c99a12"/>
  <rect x="100" y="146" width="56" height="26" rx="4" fill="none" stroke="#8a8a93" stroke-width="2"/>
  <text x="92" y="164" font-size="13" text-anchor="end" fill="#8a8a93">o : Object</text>
  <circle cx="128" cy="159" r="4.5" fill="#c99a12"/>
  <rect x="340" y="14" width="180" height="170" rx="4" fill="none" stroke="#8a8a93" stroke-width="2"/>
  <rect x="340" y="14" width="180" height="24" rx="4" fill="#8a8a93" fill-opacity="0.16" stroke="#8a8a93" stroke-width="0"/>
  <text x="430" y="30.5" font-size="13" text-anchor="middle" fill="#8a8a93" font-weight="600">Dog object</text>
  <line x1="340" y1="38" x2="520" y2="38" stroke="#8a8a93" stroke-width="1.2"/>
  <text x="352" y="70" font-size="13" text-anchor="start" fill="#8a8a93">speak()</text>
  <text x="352" y="96" font-size="13" text-anchor="start" fill="#8a8a93">fetch()</text>
  <text x="352" y="130" font-size="11" text-anchor="start" fill="#8a8a93" font-style="italic">one object, three references</text>
  <path d="M128,35 L340,35" fill="none" stroke="#c99a12" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M128,97 L340,97" fill="none" stroke="#c99a12" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M128,159 L340,159" fill="none" stroke="#c99a12" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="234" y="28" font-size="11" text-anchor="middle" fill="#8a8a93" font-style="italic">can call speak(), fetch()</text>
  <text x="234" y="90" font-size="11" text-anchor="middle" fill="#8a8a93" font-style="italic">can call speak() only</text>
  <text x="234" y="152" font-size="11" text-anchor="middle" fill="#8a8a93" font-style="italic">only Object's own methods</text>
</svg>
