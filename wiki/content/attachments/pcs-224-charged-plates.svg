<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" width="780" height="270" font-family="DM Sans, system-ui, sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8a93"/></marker></defs>
<text x="180" y="22" text-anchor="middle" fill="#8a8a93" font-weight="600">One large plate</text>
<rect x="175" y="40" width="10" height="170" fill="#2a9d8f" fill-opacity="0.5" stroke="#2a9d8f" stroke-width="1.5"/>
<g fill="#2a9d8f" font-weight="700" font-size="14" text-anchor="middle"><text x="180" y="65">+</text><text x="180" y="100">+</text><text x="180" y="135">+</text><text x="180" y="170">+</text><text x="180" y="205">+</text></g>
<g stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"><line x1="195" y1="75" x2="290" y2="75"/><line x1="195" y1="125" x2="290" y2="125"/><line x1="195" y1="175" x2="290" y2="175"/><line x1="165" y1="75" x2="70" y2="75"/><line x1="165" y1="125" x2="70" y2="125"/><line x1="165" y1="175" x2="70" y2="175"/></g>
<text x="180" y="240" text-anchor="middle" fill="#8a8a93">E = σ / 2ε₀, pointing away on both sides</text>
<text x="180" y="258" text-anchor="middle" fill="#8a8a93" font-size="12">same strength at any distance (close to a big plate)</text>

<text x="580" y="22" text-anchor="middle" fill="#8a8a93" font-weight="600">Two plates, +Q and −Q</text>
<rect x="475" y="40" width="10" height="170" fill="#2a9d8f" fill-opacity="0.5" stroke="#2a9d8f" stroke-width="1.5"/>
<rect x="675" y="40" width="10" height="170" fill="#e76f51" fill-opacity="0.5" stroke="#e76f51" stroke-width="1.5"/>
<g fill="#2a9d8f" font-weight="700" font-size="14" text-anchor="middle"><text x="480" y="65">+</text><text x="480" y="100">+</text><text x="480" y="135">+</text><text x="480" y="170">+</text><text x="480" y="205">+</text></g>
<g fill="#e76f51" font-weight="700" font-size="14" text-anchor="middle"><text x="680" y="65">−</text><text x="680" y="100">−</text><text x="680" y="135">−</text><text x="680" y="170">−</text><text x="680" y="205">−</text></g>
<g stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"><line x1="492" y1="75" x2="662" y2="75"/><line x1="492" y1="125" x2="662" y2="125"/><line x1="492" y1="175" x2="662" y2="175"/></g>
<text x="410" y="130" text-anchor="middle" fill="#8a8a93" font-size="12">E = 0</text>
<text x="750" y="130" text-anchor="middle" fill="#8a8a93" font-size="12">E = 0</text>
<text x="580" y="240" text-anchor="middle" fill="#8a8a93">Between: E = σ / ε₀, from + to −, same everywhere</text>
<text x="580" y="258" text-anchor="middle" fill="#8a8a93" font-size="12">the two plates' fields add inside and cancel outside</text>
</svg>
