<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 220" width="660" height="220" font-family="DM Sans, system-ui, sans-serif" font-size="13">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><text x="160" y="22" text-anchor="middle" fill="#8a8a93" font-weight="600">n-type (donors, Group V)</text><line x1="60" y1="50" x2="260" y2="50" stroke="#8a8a93" stroke-width="3"/><text x="54" y="54" text-anchor="end" fill="#8a8a93">E_c</text><line x1="60" y1="190" x2="260" y2="190" stroke="#8a8a93" stroke-width="3"/><text x="54" y="194" text-anchor="end" fill="#8a8a93">E_v</text><line x1="120" y1="68" x2="200" y2="68" stroke="#c99a12" stroke-width="3" stroke-dasharray="6 4"/><text x="120" y="88" fill="#c99a12" font-size="12">E_d (≈ 0.045 eV below E_c)</text><circle cx="160" cy="68" r="5" fill="#c99a12"/><path d="M160 60 L160 40" stroke="#2a9d8f" stroke-width="2" marker-end="url(#ah)" fill="none"/><text x="160" y="135" text-anchor="middle" fill="#8a8a93" font-size="12">donor electron is promoted</text><text x="160" y="152" text-anchor="middle" fill="#8a8a93" font-size="12">into the conduction band</text><text x="480" y="22" text-anchor="middle" fill="#8a8a93" font-weight="600">p-type (acceptors, Group III)</text><line x1="380" y1="50" x2="580" y2="50" stroke="#8a8a93" stroke-width="3"/><text x="374" y="54" text-anchor="end" fill="#8a8a93">E_c</text><line x1="380" y1="190" x2="580" y2="190" stroke="#8a8a93" stroke-width="3"/><text x="374" y="194" text-anchor="end" fill="#8a8a93">E_v</text><line x1="440" y1="172" x2="520" y2="172" stroke="#c99a12" stroke-width="3" stroke-dasharray="6 4"/><text x="440" y="160" fill="#c99a12" font-size="12">E_a (≈ 0.045 eV above E_v)</text><path d="M480 188 L480 178" stroke="#2a9d8f" stroke-width="2" marker-end="url(#ah)" fill="none"/><text x="480" y="95" text-anchor="middle" fill="#8a8a93" font-size="12">acceptor level takes a valence</text><text x="480" y="112" text-anchor="middle" fill="#8a8a93" font-size="12">electron, leaving a hole behind</text>
</svg>
